name: LMS Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Grant permission
        run: chmod +x gradlew

      - name: Run Automation Test
        run: ./gradlew clean test -Dbrowser=${{ matrix.browser }}
        env:
          Login_Username: ${{ secrets.LOGIN_USERNAME }}
          Login_Password: ${{ secrets.LOGIN_PASSWORD }}
        continue-on-error: true

      # ================= PARSE RESULT =================
      - name: Parse Test Result
        id: result
        run: |
          PASS=$(grep -r "testsuite" build/test-results/test/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          FAIL=$(grep -r "testsuite" build/test-results/test/*.xml | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          SKIP=$(grep -r "testsuite" build/test-results/test/*.xml | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')

          echo "pass=$PASS" >> $GITHUB_OUTPUT
          echo "fail=$FAIL" >> $GITHUB_OUTPUT
          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Upload Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: |
            reports/**
            build/reports/**
            build/test-results/**
            reports/screenshots/**

      # ================= TELEGRAM =================
      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          PASS="${{ steps.result.outputs.pass }}"
          FAIL="${{ steps.result.outputs.fail }}"
          SKIP="${{ steps.result.outputs.skip }}"

          MESSAGE="🚀 LMS Automation Result
Browser : ${{ matrix.browser }}
Status  : $STATUS
Pass    : $PASS
Fail    : $FAIL
Skip    : $SKIP
Repo    : ${{ github.repository }}
Branch  : ${{ github.ref_name }}"
  
  curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
  -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
  -d text="$MESSAGE"